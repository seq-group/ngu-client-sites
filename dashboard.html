<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NGU Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#e5e5e5;font-family:-apple-system,sans-serif;padding:16px}h1{font-size:22px;margin-bottom:12px}.card{background:#141414;border:1px solid #222;border-radius:12px;padding:16px;margin-bottom:12px}.card h2{font-size:15px;margin-bottom:10px}.badge{background:#BA1212;color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;margin-left:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:768px){.grid{grid-template-columns:1fr}}.row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1a1a1a;font-size:13px}.row input[type=checkbox]{accent-color:#BA1212;width:16px;height:16px}.done span{text-decoration:line-through;opacity:.4}.tab{padding:3px 10px;border-radius:6px;cursor:pointer;font-size:11px;background:#1a1a1a;border:none;color:#888}.tab.on{background:#BA1212;color:#fff}a{color:#BA1212;text-decoration:none}.btn{background:#BA1212;color:#fff;border:none;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px}.alert{background:#BA1212;color:#fff;padding:8px;border-radius:8px;margin-bottom:8px;font-size:13px}.add{display:flex;gap:6px;margin-top:6px}.add input{flex:1;background:#1a1a1a;border:1px solid #333;color:#e5e5e5;padding:5px 8px;border-radius:6px;font-size:12px}.inv{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1a1a1a;font-size:13px}.inv.paid{opacity:.3;text-decoration:line-through}
</style></head><body>
<div class="alert" id="alertBar">Loading...</div>
<h1>NGU Business Dashboard <span style="float:right;font-size:11px;color:#666;cursor:pointer" onclick="loadAll()">↻</span></h1>
<div class="grid">
<div class="card"><h2>✅ Tasks <span class="badge" id="taskCount">0</span></h2><div id="tasks"></div><div class="add"><input id="newTask" placeholder="Add task..." onkeydown="if(event.key==='Enter')addTask()"><button class="btn" onclick="addTask()">+</button></div></div>
<div class="card"><h2>🏠 Properties</h2><div class="row"><span class="badge">Live</span><a href="https://seq-group.github.io/ngu-client-sites/16-viewbank/">16 Viewbank Ct Beenleigh</a></div><div class="row"><span class="badge">Live</span><a href="https://seq-group.github.io/ngu-client-sites/508-chester/">508 Chester Seller</a></div><div class="row"><span class="badge">Live</span><a href="https://seq-group.github.io/ngu-client-sites/508-chester/buyer/">508 Chester Buyer</a></div><div class="row"><span class="badge">Live</span><a href="https://seq-group.github.io/ngu-client-sites/lawson-street/">33208 Lawson St</a></div><div class="row"><span style="background:#ca8a04" class="badge">Draft</span>24D/973 Palm Beach</div></div>
<div class="card"><h2>📧 Emails <span class="badge" id="emailCount">0</span></h2><div id="emailTabs" style="display:flex;gap:4px;margin-bottom:8px"></div><div id="emails" style="max-height:300px;overflow-y:auto"></div></div>
<div class="card"><h2>🧹 Elevex <span class="badge" id="invCount">$0</span></h2><div id="invoices"></div></div>
<div class="card"><h2>📊 Rex CRM</h2><div id="crm"><div class="row">Loading...</div></div></div>
<div class="card"><h2>📋 Open Home</h2><div id="checklist"></div><div style="margin-top:6px;display:flex;gap:6px"><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="localStorage.removeItem('chk');loadChecklist()">Reset</button></div></div>
<div class="card"><h2>⛳ New Business</h2><div class="row">🏌️ Golf head covers</div><div class="row">🪸 Coral vault</div></div>
</div>
<script>
const API='http://localhost:9120';
const TASKS_K='cyril_tasks',INV_K='cyril_inv',CHK_K='cyril_chk';
const defaultTasks=[{id:'ato',t:'Pay ATO',d:0},{id:'papi',t:'Pay $1,500 Papi (rent)',d:0},{id:'ins',t:'Pay insurance',d:0},{id:'mam',t:'Pay maman',d:0},{id:'law',t:'Drop file to lawyer',d:0}];
const defaultInv=[{id:'trailer',d:'Trailer',a:400,p:0},{id:'byron',d:'Byron pay',a:500,p:0},{id:'printer',d:'Printer',a:200,p:0},{id:'pool',d:'Pool shop',a:135,p:0},{id:'bunnings',d:'Bunnings',a:86.78,p:0},{id:'sydney',d:'Sydney transport',a:27.67,p:0},{id:'capcut',d:'CapCut',a:139.99,p:0}];
const chkItems=['Business cards','QR code docs','Appraisal sheet','Broker sheet','Fast facts','Water','Mints','Candle','A-frame','Form 2','Contract','Brochures','iPad charged','Signboard'];
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));if(v)return v}catch(e){}return JSON.parse(JSON.stringify(d))}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
let allEmails=[],emailCat='all';
function loadAll(){
  fetch(API+'/summary').then(r=>r.json()).then(s=>{document.getElementById('alertBar').textContent=s.tasks_pending+' tasks | $'+s.invoices_owed.toFixed(0)+' Elevex owed | '+s.emails_24h+' emails (24h) | '+s.time}).catch(()=>{document.getElementById('alertBar').textContent='API offline'});
  fetch(API+'/emails').then(r=>r.json()).then(e=>{allEmails=e;renderEmails()}).catch(()=>{});
  fetch(API+'/crm').then(r=>r.json()).then(c=>renderCRM(c)).catch(()=>{});
  renderTasks();renderInv();loadChecklist();
}
function renderTasks(){const tasks=load(TASKS_K,defaultTasks),el=document.getElementById('tasks');el.innerHTML='';document.getElementById('taskCount').textContent=tasks.filter(t=>!t.d).length;tasks.forEach((t,i)=>{el.innerHTML+='<div class="row'+(t.d?' done':'')+'"><input type="checkbox" '+(t.d?'checked':'')+' onchange="toggleTask('+i+')"><span>'+t.t+'</span><button style="margin-left:auto;background:none;border:none;color:#444;cursor:pointer" onclick="delTask('+i+')">×</button></div>'})}
function toggleTask(i){const t=load(TASKS_K,defaultTasks);t[i].d=t[i].d?0:1;save(TASKS_K,t);renderTasks();loadAll()}
function delTask(i){const t=load(TASKS_K,defaultTasks);t.splice(i,1);save(TASKS_K,t);renderTasks()}
function addTask(){const inp=document.getElementById('newTask');if(!inp.value.trim())return;const t=load(TASKS_K,defaultTasks);t.push({id:'t'+Date.now(),t:inp.value.trim(),d:0});save(TASKS_K,t);inp.value='';renderTasks()}
function renderEmails(){const cats=['all','real_estate','finance','elevex','personal','other'],labels={all:'All',real_estate:'RE',finance:'Finance',elevex:'Elevex',personal:'Personal',other:'Other'};document.getElementById('emailTabs').innerHTML=cats.map(c=>'<button class="tab'+(emailCat===c?' on':'')+'" onclick="emailCat=\''+c+'\';renderEmails()">'+labels[c]+'</button>').join('');const filtered=emailCat==='all'?allEmails:allEmails.filter(e=>e.category===emailCat);document.getElementById('emailCount').textContent=filtered.length;document.getElementById('emails').innerHTML=filtered.map(e=>'<div class="row" style="flex-wrap:wrap"><span style="color:#888;font-size:11px;width:100%">'+e.from.split('<')[0].trim().slice(0,30)+'</span><span style="width:100%">'+e.subject.slice(0,60)+'</span></div>').join('')}
function renderInv(){const inv=load(INV_K,defaultInv),el=document.getElementById('invoices');el.innerHTML='';let total=0;inv.forEach((v,i)=>{if(!v.p)total+=v.a;el.innerHTML+='<div class="inv'+(v.p?' paid':'')+'"><span>$'+v.a.toFixed(2)+' \u2014 '+v.d+'</span><input type="checkbox" '+(v.p?'checked':'')+' onchange="toggleInv('+i+')"></div>'});document.getElementById('invCount').textContent='$'+total.toFixed(0)}
function toggleInv(i){const inv=load(INV_K,defaultInv);inv[i].p=inv[i].p?0:1;save(INV_K,inv);renderInv();loadAll()}
function renderCRM(c){document.getElementById('crm').innerHTML='<div class="row">\uD83D\uDCC8 '+(c.contacts||0).toLocaleString()+' contacts</div><div class="row">\uD83C\uDFE0 '+(c.listings||0).toLocaleString()+' listings</div><div class="row">\uD83D\uDCCB '+(c.appraisals||0).toLocaleString()+' appraisals</div><div class="row">\u23F0 '+(c.reminders||0).toLocaleString()+' reminders</div><div class="row">\uD83D\uDCDD '+(c.activities||0).toLocaleString()+' activities</div>'}
function loadChecklist(){const chk=load(CHK_K,{}),el=document.getElementById('checklist');el.innerHTML='';chkItems.forEach(item=>{el.innerHTML+='<label style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px"><input type="checkbox" '+(chk[item]?'checked':'')+' onchange="toggleChk(\''+item+'\')">'+item+'</label>'})}
function toggleChk(item){const chk=load(CHK_K,{});chk[item]=chk[item]?0:1;save(CHK_K,chk);loadChecklist()}
loadAll();setInterval(loadAll,300000);
</script></body></html>
